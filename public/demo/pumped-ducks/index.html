<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Pumped Ducks App — Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --surface:#141416; --surface2:#1c1c1f; --surface3:#26262a;
  --line:rgba(255,255,255,.08); --text:#f5f5f6; --muted:#9b9ba3; --dim:#6b6b73;
  --accent:#f4f4f5; --accent-ink:#0a0a0b; --accent-soft:rgba(244,244,245,.12);
  --ok:#34d399; --radius:18px;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#050506;color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
input{font:inherit;color:inherit}

/* ---------- desktop stage ---------- */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 50% 35%,var(--accent-soft),transparent 60%),#050506}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:58px;padding:12px;
  background:linear-gradient(145deg,#2a2a2e,#0d0d0f);
  box-shadow:0 0 0 1.5px #3a3a3f inset,0 40px 120px rgba(0,0,0,.7),0 0 0 1px #000;
  transform-origin:center center}
.phone .island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:120px;height:34px;
  border-radius:20px;background:#000;z-index:50}
.app{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);isolation:isolate}
.page-note{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11.5px;color:#6b6b73;letter-spacing:.01em}
.page-note b{color:#9b9ba3;font-weight:600}

.statusbar{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 30px 0 34px;display:flex;
  justify-content:space-between;align-items:flex-start;font-weight:600;font-size:15px;z-index:40;pointer-events:none}
.statusbar .sb-r{display:flex;gap:6px;align-items:center;padding-top:2px}
.statusbar svg{height:12px;width:auto;fill:currentColor}

/* ---------- screens ---------- */
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(96px + var(--sab,0px));
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease);
  scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.screen.active{opacity:1;transform:none;pointer-events:auto}
.hdr{position:sticky;top:0;z-index:10;padding:62px 20px 12px;display:flex;align-items:center;gap:10px;
  justify-content:space-between;background:var(--bg)}
.hdr::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;
  background:linear-gradient(var(--bg),rgba(10,10,11,0))}
.hdr.col{display:block}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr .cats{margin:12px -20px 0}
.hdr h1{margin:0;font:800 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.wordmark{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;max-width:250px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);position:relative;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface2)}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.section{padding:0 20px;margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 20px 12px}
.sec-h h2{margin:0;font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.sec-h button{font-size:13px;color:var(--muted);font-weight:600}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* hero */
.hero{position:relative;margin:4px 16px 0;height:430px;border-radius:26px;overflow:hidden;background:var(--surface)}
.hero img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.82))}
.hero .hero-c{position:absolute;left:20px;right:20px;bottom:20px;z-index:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.hero h3{margin:12px 0 14px;font:800 36px/.95 var(--display);text-transform:uppercase;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;
  font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text);backdrop-filter:blur(10px)}
.btn.white{background:#fff;color:#000}
.btn svg{width:18px;height:18px}

/* countdown */
.drop-card{margin:16px 16px 0;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.drop-card::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(var(--accent-soft),transparent 70%)}
.drop-top{display:flex;justify-content:space-between;align-items:center;position:relative}
.drop-when{font-weight:600;margin-top:4px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative}
.cd div{background:var(--surface2);border-radius:14px;padding:10px 0 8px;text-align:center}
.cd b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.cd span{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.pill-btn{height:34px;padding:0 14px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.pill-btn svg{width:15px;height:15px}
.pill-btn.on{background:var(--accent);color:var(--accent-ink)}

/* rails + cards */
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 20px}
.rail::-webkit-scrollbar{display:none}
.rail .pcard{width:150px;flex:none;scroll-snap-align:start}
.pcard{text-align:left;display:block;width:100%;min-width:0}
.pimg{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--surface2)}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.pcard:active .pimg img{transform:scale(1.04)}
.pt{margin-top:9px;font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp{margin-top:3px;font-size:13px;color:var(--muted);font-weight:500}
.pp s{color:var(--dim);margin-left:4px}
.pp .sale{color:var(--accent)}
.badge{position:absolute;left:8px;top:8px;max-width:calc(100% - 56px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(6px)}
.badge.acc{background:var(--accent);color:var(--accent-ink)}
.heart{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;transition:transform .2s}
.heart svg{width:16px;height:16px}
.heart.on svg{fill:var(--accent);stroke:var(--accent)}
.heart:active{transform:scale(.85)}
.soldout .pimg img{opacity:.45;filter:grayscale(.6)}

.cats{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;
  white-space:nowrap;transition:background .2s,color .2s;border:1px solid transparent}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.55;margin-left:4px;font-weight:600}

/* shop */
.search{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.search input::placeholder{color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:4px 20px 0}
.count{margin:10px 20px 10px;font-size:12px;color:var(--muted);font-weight:500}
.empty{padding:50px 30px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;margin:0 auto 12px;display:block;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;top:62px;z-index:61;background:var(--bg);border-radius:28px 28px 0 0;
  transform:translateY(102%);transition:transform .42s var(--ease);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet-scroll{flex:1;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.sheet-scroll::-webkit-scrollbar{display:none}
.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);z-index:3}
.sheet .close{position:absolute;top:16px;right:16px;z-index:3;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(8px)}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(92vw,350px);background:var(--surface2)}
.carousel::-webkit-scrollbar{display:none}
.carousel img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-22px;position:relative;z-index:2;height:22px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:width .25s,background .25s}
.dots i.on{width:18px;background:#fff}
.sb{padding:18px 20px 20px}
.sb h2{margin:6px 0 6px;font:800 27px/1 var(--display);text-transform:uppercase}
.price{font-size:18px;font-weight:700}
.price s{color:var(--dim);font-weight:500;margin-left:8px;font-size:15px}
.size-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.size-h b{font-size:14px}
.size-h span{font-size:12px;color:var(--muted)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size{position:relative;height:48px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:14px;
  border:1.5px solid transparent;transition:border-color .15s,background .15s;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.size.sel{border-color:var(--accent);background:var(--accent-soft)}
.size.out{color:var(--dim);background:var(--surface);border:1.5px dashed rgba(255,255,255,.12)}
.size.out .lbl{text-decoration:line-through}
.size .bell{position:absolute;right:4px;top:4px;width:14px;height:14px;color:var(--dim)}
.size.out.alert{border:1.5px solid var(--accent);color:var(--text)}
.size.out.alert .bell{color:var(--accent);fill:var(--accent)}
.hint{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint svg{width:14px;height:14px;flex:none;margin-top:1px}
.desc{margin-top:22px;color:var(--muted);font-size:14px;line-height:1.55}
.sheet-cta{display:flex;gap:10px;padding:12px 20px calc(16px + var(--sab,0px));border-top:1px solid var(--line);background:var(--bg)}
.sheet-cta .btn{flex:1}
.sq{width:52px;height:48px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none;transition:transform .15s}
.sq svg{width:22px;height:22px}
.sq.on svg{fill:var(--accent);stroke:var(--accent)}
.sq:active{transform:scale(.9)}

/* drops */
.upcoming{position:relative;margin:4px 16px 0;border-radius:26px;overflow:hidden;min-height:400px;background:#111;display:flex;flex-direction:column;justify-content:flex-end}
.upcoming .collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;filter:blur(14px) brightness(.55) saturate(1.2);transform:scale(1.15)}
.upcoming .collage img{width:100%;height:100%;object-fit:cover}
.upcoming .lock{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.12);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff}
.upcoming .lock svg{width:24px;height:24px}
.upcoming .uc{position:relative;padding:20px;color:#fff}
.upcoming h3{margin:10px 0 2px;font:800 40px/.95 var(--display);text-transform:uppercase}
.upcoming .cd div{background:rgba(255,255,255,.1);backdrop-filter:blur(10px)}
.upcoming .cd span{color:rgba(255,255,255,.65)}
.members{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 12px 7px 9px;border-radius:99px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.18)}
.members i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.members i svg{width:12px;height:12px;stroke-width:2.6}
.uc-row{display:flex;gap:10px;margin-top:16px}
.uc-row .btn{flex:1}

.lockscreen{margin:0 16px;border-radius:26px;padding:26px 14px 16px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--accent-soft),transparent 60%),linear-gradient(200deg,#23232a,#0e0e11)}
.ls-time{text-align:center;color:#fff}
.ls-time small{display:block;font-size:14px;font-weight:600;opacity:.8}
.ls-time b{display:block;font-size:64px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.notif{display:flex;gap:10px;padding:12px;border-radius:20px;margin-top:8px;background:rgba(40,40,46,.72);backdrop-filter:blur(20px);color:#fff;
  animation:pop .6s var(--ease) both}
.notif:nth-child(3){animation-delay:.15s;transform-origin:top}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.appicon{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);
  font:800 17px/1 var(--display);letter-spacing:.02em}
.notif .nb{flex:1;min-width:0}
.notif .nt{display:flex;justify-content:space-between;font-size:13px}
.notif .nt b{font-weight:700}
.notif .nt span{opacity:.55;font-size:12px}
.notif p{margin:1px 0 0;font-size:13px;opacity:.85;line-height:1.3}
.notif img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none}

.past{margin:0 16px;display:flex;flex-direction:column;gap:10px}
.past-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);width:100%;text-align:left}
.stack{display:flex;flex:none}
.stack img{width:44px;height:56px;border-radius:9px;object-fit:cover;border:2px solid var(--surface);margin-left:-14px}
.stack img:first-child{margin-left:0}
.past-row .pr{flex:1;min-width:0}
.past-row b{display:block;font-size:14px}
.past-row span{font-size:12px;color:var(--muted)}
.past-row svg{width:18px;height:18px;color:var(--dim);flex:none}

/* wishlist */
.wl{margin:0 16px;display:flex;flex-direction:column;gap:12px}
.wl-item{background:var(--surface);border-radius:20px;padding:12px;animation:pop .35s var(--ease) both}
.wl-top{display:flex;gap:12px}
.wl-top img{width:76px;height:95px;border-radius:12px;object-fit:cover;flex:none;cursor:pointer}
.wl-info{flex:1;min-width:0}
.wl-info b{display:block;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wl-info .pp{margin-top:4px}
.stock{margin-top:6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.stock i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.stock.warn i{background:#f59e0b}
.stock.bad i{background:#ef4444}
.wl-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.wl-x svg{width:16px;height:16px}
.wl-sizes{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.wl-sizes .eyebrow{font-size:10px;margin-bottom:8px;display:block}
.alert-row{display:flex;flex-wrap:wrap;gap:6px}
.al{height:32px;padding:0 10px;border-radius:10px;background:var(--surface2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.al svg{width:13px;height:13px}
.al.instock{background:transparent;border:1px solid var(--line);color:var(--muted);cursor:default}
.al.on{background:var(--accent);color:var(--accent-ink)}
.al.on svg{fill:currentColor}

/* profile */
.me{display:flex;align-items:center;gap:14px;margin:4px 20px 0}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#333);display:grid;place-items:center;
  font:800 22px/1 var(--display);color:var(--accent-ink)}
.me b{display:block;font-size:19px}
.me span{font-size:13px;color:var(--muted)}
.tier{margin:18px 16px 0;border-radius:24px;padding:20px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#2b2b31 0%,#131316 60%);border:1px solid rgba(255,255,255,.1)}
.tier::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 90% 0%,var(--accent-glow,rgba(255,255,255,.18)),transparent 70%)}
.tier::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.07) 45%,transparent 55%);
  animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.tier>*{position:relative;z-index:1}
.tier-top{display:flex;justify-content:space-between;align-items:flex-start}
.tier-name{font:800 26px/1 var(--display);text-transform:uppercase;margin-top:6px}
.tier .eyebrow{color:rgba(255,255,255,.6)}
.pts{text-align:right}
.pts b{display:block;font:800 34px/1 var(--display)}
.pts span{font-size:11px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent-bar,var(--accent));border-radius:3px;transition:width 1.2s var(--ease)}
.bar-l{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65);margin-top:8px}
.perks{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.perks span{font-size:11px;font-weight:700;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.1)}
.order{margin:0 16px;background:var(--surface);border-radius:22px;padding:16px}
.order-top{display:flex;justify-content:space-between;align-items:center}
.order-top b{font-size:15px}
.order-top span{font-size:12px;color:var(--muted)}
.eta{font:800 24px/1 var(--display);text-transform:uppercase;margin-top:14px}
.eta small{display:block;font:600 12px Inter,sans-serif;color:var(--muted);text-transform:none;margin-bottom:4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;position:relative}

/* ---------- state (in memory, mirrored to localStorage when available) ---------- */
const KEY = "jpxdemo:" + C.slug;
const S = { wish: [], alerts: {}, dropReminder: false, prefs: { drops: true, restock: true, orders: true, promo: false } };
const restock = P.filter(p => p.so && p.s.some(s => !s[1]));
const backSoon = restock.filter(p => p.av).concat(restock.filter(p => !p.av)).slice(0, 12);
(function load(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (saved && typeof saved === "object") { Object.assign(S, saved); S.wish = S.wish.filter(id => BY.has(id)); return; }
  // Seed a believable starting state: two saved items, one with a restock alert set.
  const seed = [backSoon[0], P[0], P.find(p => p !== backSoon[0] && p !== P[0] && p.av)].filter(Boolean);
  S.wish = [...new Set(seed.map(p => p.id))].slice(0, 3);
  if (backSoon[0]) { const out = backSoon[0].s.find(s => !s[1]); if (out) S.alerts[backSoon[0].id] = [out[0]]; }
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const isWished = id => S.wish.includes(id);
const hasAlert = (id, size) => (S.alerts[id] || []).includes(size);

/* ---------- drop date ---------- */
function nextDrop(){
  if (C.dropDate) { const d = new Date(C.dropDate); if (!isNaN(d)) return d; }
  const d = new Date(); d.setHours(12, 0, 0, 0);
  let add = (7 - d.getDay()) % 7;
  if (add === 0 && Date.now() >= d.getTime()) add = 7;
  d.setDate(d.getDate() + add);
  return d;
}
const DROP = nextDrop();
const dropLabel = DROP.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + " · " +
  DROP.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const cdHTML = () => `<div class="cd" data-cd>${["Days","Hrs","Min","Sec"].map(l => `<div><b>00</b><span>${l}</span></div>`).join("")}</div>`;
function tick(){
  let ms = Math.max(0, DROP - Date.now());
  const parts = [864e5, 36e5, 6e4, 1e3].map(u => { const v = Math.floor(ms / u); ms -= v * u; return v; });
  document.querySelectorAll("[data-cd]").forEach(el => el.querySelectorAll("b").forEach((b, i) => {
    const v = String(parts[i]).padStart(2, "0"); if (b.textContent !== v) b.textContent = v;
  }));
  const t = new Date(); $("#clock").textContent = t.getHours() % 12 + (t.getHours() % 12 ? 0 : 12) + ":" + String(t.getMinutes()).padStart(2, "0");
}

  else if (opts.restock && outCount(p)) badge = `<span class="badge acc">Restocking</span>`;

  return `<button class="pcard ${p.av ? "" : "soldout"}" data-open="${p.id}">
    <div class="pimg"><img loading="lazy" src="${esc(p.img[0])}" alt="">${badge}
      <span class="heart ${isWished(p.id) ? "on" : ""}" data-wish="${p.id}" role="button" aria-label="Save">${I.heart}</span></div>

/* ---------- product sheet ---------- */

        <div class="sizes">${sizesHTML}</div>
        ${anyOut ? `<div class="hint">${I.bell}<span>Sold out in your size? Tap a greyed-out size and we'll notify you the moment it's back.</span></div>` : ""}
        ${p.d ? `<div class="desc">${esc(p.d)}</div>` : ""}

const TABS = [["home", "Home", I.home], ["shop", "Shop", I.shop], ["drops", "Drops", I.drops], ["wish", "Wishlist", I.heart], ["profile", "Profile", I.user]];
$("#tabbar").innerHTML = TABS.map(([k, l, ic]) => `<button class="tab ${k === "home" ? "on" : ""}" data-tab="${k}">${ic}<span>${l}</span>${k === "wish" ? '<b class="cnt" id="wish-cnt"></b>' : ""}</button>`).join("");

function go(tab){
  if (sheetId) closeSheet();
  const scr = $("#s-" + tab);
  if (tab === current) { scr.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (tab === "wish") renderWish();
  if (tab === "drops") renderDrops();
  if (tab === "profile") { renderProfile(); animateProfile(); }
  if (tab === "shop") renderShop();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s === scr));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  current = tab;
}

function refreshHearts(id){
  document.querySelectorAll(`[data-wish="${id}"].heart, .sq[data-wish="${id}"]`).forEach(h => h.classList.toggle("on", isWished(id)));
}
function toggleWish(id){
  id = +id;
  const on = !isWished(id);
  S.wish = on ? [id, ...S.wish] : S.wish.filter(x => x !== id);
  save(); refreshHearts(id);
  const cnt = $("#wish-cnt"); cnt.textContent = S.wish.length || ""; cnt.classList.add("bump"); setTimeout(() => cnt.classList.remove("bump"), 250);
  if (current === "wish") renderWish();
  toast(on ? "Saved to wishlist" : "Removed from wishlist", I.heart);
}
function toggleAlert(id, size){
  id = +id;
  const list = S.alerts[id] || [];
  const on = !list.includes(size);
  S.alerts[id] = on ? [...list, size] : list.filter(s => s !== size);
  if (on && !isWished(id)) { S.wish = [id, ...S.wish]; $("#wish-cnt").textContent = S.wish.length; }
  save();
  if (sheetId === id) renderSheet(false);
  if (current === "wish") renderWish();
  toast(on ? `We'll ping you when ${size} is back` : `Alert off for ${size}`, I.bell);
}
function setReminder(){
  S.dropReminder = !S.dropReminder; save();
  if (current === "drops") renderDrops();
  renderHome();
  toast(S.dropReminder ? "You'll get a push when the drop goes live" : "Drop reminder off", I.bell);
}

$("#app").addEventListener("click", e => {
  const t = e.target.closest("[data-wish],[data-alert],[data-size-pick],[data-add],[data-notify-any],[data-close],[data-remind],[data-chip],[data-gocat],[data-pref],[data-tab],[data-open]");
  if (!t) { if (e.target.id === "scrim") closeSheet(); return; }
  const d = t.dataset;
  if (d.wish) return toggleWish(d.wish);
  if (d.alert) return toggleAlert(d.alert, d.size);
  if (d.sizePick !== undefined) { sheetSize = d.sizePick; return renderSheet(false); }
  if (t.hasAttribute("data-add")) {
    if (sheetId && BY.get(sheetId).s.length && !sheetSize) return toast("Pick a size first", I.bag);
    return toast("Added to bag" + (sheetSize ? ` · size ${sheetSize}` : ""), I.bag);
  }
  if (t.hasAttribute("data-notify-any")) { const p = BY.get(sheetId); return toggleAlert(p.id, p.s.length ? p.s[0][0] : "One size"); }
  if (t.hasAttribute("data-close")) return closeSheet();
  if (t.hasAttribute("data-remind")) return setReminder();
  if (d.chip) { shopCat = d.chip; renderShop(); return; }
  if (d.gocat) { shopCat = d.gocat; renderShop(); return go("shop"); }
  if (d.pref) { S.prefs[d.pref] = !S.prefs[d.pref]; save(); t.querySelector(".toggle").classList.toggle("on", S.prefs[d.pref]); return; }
  if (d.tab) return go(d.tab);
  if (d.open) return openSheet(d.open);
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- desktop phone scaling ---------- */
function fit(){
  const ph = $("#phone");
  if (innerWidth <= 520) { ph.style.transform = ""; return; }
  const s = Math.min(1, (innerHeight - 64) / 844, (innerWidth - 32) / 390);
  ph.style.transform = `scale(${s})`;
}
addEventListener("resize", fit);

renderHome(); renderShop(); renderWish();
fit(); tick(); setInterval(tick, 1000);
})();
</script>
</body>
